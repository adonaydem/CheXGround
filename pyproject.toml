[build-system]
requires = ["setuptools>=61.0,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chexground"
version = "1.0.0"
description = "Anatomical region tokens for grounded longitudinal chest X-ray interpretation."
readme = "README.md"
requires-python = ">=3.10,<3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "transformers==4.51.3",
    "tokenizers==0.21.1",
    "accelerate==1.6.0",
    "peft==0.4.0",
    "bitsandbytes==0.43.2",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "scikit-learn==1.2.2",
    "sentencepiece==0.1.99",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "timm==1.0.15",
    "open-clip-torch==2.23.0",
    "protobuf==3.20.3",
    "pydicom==3.0.2",
    "pillow==12.3.0",
    "addict==2.4.0",
    "yapf==0.40.1",
    "opencv-python==4.11.0.86",
    "pycocotools==2.0.11",
    "terminaltables==3.1.10",
    "requests",
    "shortuuid",
    "tqdm",
]

[project.optional-dependencies]
train = [
    "deepspeed==0.16.7",
    "datasets==5.0.1",
    "pydantic==2.11.4",
    "ninja==1.13.2",
    "wandb==0.25.0",
    "xformers==0.0.27.post2",
]
eval = [
    "evaluate==0.4.6",
    "rouge-score==0.1.2",
    "absl-py==2.5.0",
    "nltk==3.10.3",
    "bert-score==0.3.13",
]

[tool.setuptools.packages.find]
include = ["chexground*", "gloria*", "mmdet*", "mmcv.mmcv*", "Libra.libra*"]
